name: Build Ember

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        working-directory: ember-client
        run: |
          chmod +x gradlew
          ./gradlew build curseforgeZip --no-daemon
          rm -f build/libs/*-sources.jar
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Ember (build ${{ github.run_number }})
          make_latest: true
          body: |
            **Import into CurseForge:** Ember-Client-2.0.0.zip
            **Or drop into a Fabric 1.21.1 profile's mods folder:** ember-client-2.0.0.jar
          files: |
            ember-client/build/curseforge/*.zip
            ember-client/build/libs/*.jar
